# .github/workflows/daily_scan.yml
# ──────────────────────────────────────────────────────────────────────────────
# Runs the Sniper Trading Bot on a schedule:
#   - Daily scan at 09:15 IST (03:45 UTC) on weekdays
#   - Outcome tracker at 16:00 IST (10:30 UTC) on weekdays
#   - Weekly summary every Sunday at 08:00 IST (02:30 UTC)
#
# Required GitHub Secrets:
#   EMAIL_SENDER    — Gmail address sending the report
#   EMAIL_PASSWORD  — Gmail App Password (NOT your account password)
#   EMAIL_RECEIVER  — Address to receive reports
# ──────────────────────────────────────────────────────────────────────────────

name: Claude Trading Bot

on:
  schedule:
    # Daily scan — 09:15 IST (03:45 UTC) Mon-Fri
    - cron: "45 3 * * 1-5"
    # Outcome tracker — 16:00 IST (10:30 UTC) Mon-Fri
    - cron: "30 10 * * 1-5"
    # Weekly summary — Sunday 08:00 IST (02:30 UTC)
    - cron: "30 2 * * 0"

  # Allow manual triggers from the Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - track
          - weekly-summary
          - backtest
          - dry-run
      wallet:
        description: "Wallet for backtest (leave empty for all)"
        required: false
        default: ""
      backtest_start:
        description: "Backtest start date (YYYY-MM-DD)"
        required: false
        default: "2022-01-01"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Restore persistent data (DB + cache) from artifact ────────────
      - name: Restore persistent data
        uses: actions/cache@v4
        with:
          path: |
            trading_history.db
            .cache/
            sniper_bot.log
          key: sniper-bot-data-${{ runner.os }}
          restore-keys: sniper-bot-data-

      # ── 5. Determine mode ─────────────────────────────────────────────────
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            DAY=$(date -u +%u)
            if [ "$DAY" = "7" ]; then
              echo "mode=weekly-summary" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "10" ]; then
              echo "mode=track" >> $GITHUB_OUTPUT
            else
              echo "mode=scan" >> $GITHUB_OUTPUT
            fi
          fi

      # ── 6. Run the bot ────────────────────────────────────────────────────
      - name: Run daily scan
        if: steps.mode.outputs.mode == 'scan'
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py

      - name: Run outcome tracker
        if: steps.mode.outputs.mode == 'track'
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py --track

      - name: Run weekly summary
        if: steps.mode.outputs.mode == 'weekly-summary'
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py --weekly-summary

      - name: Run dry-run scan
        if: steps.mode.outputs.mode == 'dry-run'
        run: python main.py --dry-run

      - name: Run backtest
        if: steps.mode.outputs.mode == 'backtest'
        run: |
          WALLET_ARG=""
          if [ -n "${{ github.event.inputs.wallet }}" ]; then
            WALLET_ARG="--wallet ${{ github.event.inputs.wallet }}"
          fi
          python main.py --backtest $WALLET_ARG \
            --start "${{ github.event.inputs.backtest_start || '2022-01-01' }}"

      # ── 7. Upload backtest results as artifact ────────────────────────────
      - name: Upload backtest CSV
        if: steps.mode.outputs.mode == 'backtest'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_*.csv
          retention-days: 30

      # ── 8. Upload log as artifact on failure ──────────────────────────────
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: sniper_bot.log
          retention-days: 7
