# ============================================================
# SNIPER TRADING BOT — MASTER CONFIGURATION
# All tuneable parameters live here. No code changes needed.
# ============================================================

app:
  dry_run: false                  # true = scan but skip email + DB writes
  db_file: "trading_history.db"
  log_level: "INFO"               # DEBUG | INFO | WARNING | ERROR
  log_file: "sniper_bot.log"
  alert_cooldown_days: 5          # Skip re-alerting same stock within N days
  min_data_rows: 200              # Minimum history rows required per ticker

market:
  index_ticker: "^NSEI"
  vix_ticker: "^INDIAVIX"
  breadth_universe_url: "https://archives.nseindia.com/content/indices/ind_nifty500list.csv"
  ema_guard_period: 50            # Nifty must be above this EMA to scan
  # Breadth = % of Nifty 500 stocks above their 200 DMA
  breadth_bull_threshold: 60      # >= 60%  → full scan, all strategies
  breadth_mixed_threshold: 40     # 40-60%  → pullback + mean_reversion only
                                  # < 40%   → bear mode, no new entries

risk:
  base_risk_pct: 0.01             # Risk 1% of wallet cap per trade (base)
  high_vix_threshold: 20          # India VIX above this → reduce risk
  low_vix_threshold: 14           # India VIX below this → allow higher risk
  high_vix_risk_pct: 0.005        # Risk only 0.5% when VIX is elevated
  low_vix_risk_pct: 0.015         # Risk up to 1.5% when VIX is calm
  max_portfolio_exposure_pct: 0.60  # Max 60% of total capital in open trades
  max_sector_signals: 3           # Max signals from same sector per day
  monthly_drawdown_limit_pct: 0.05  # Pause if monthly loss > 5% of total cap
  min_rr_ratio: 2.0               # Minimum reward:risk to qualify a signal
  min_qty: 5                      # Discard signals needing fewer than 5 shares

filters:
  # RSI thresholds per strategy
  rsi_pullback_min: 40
  rsi_pullback_max: 65
  rsi_breakout_min: 55
  rsi_mean_reversion_max: 35      # Oversold threshold
  # Minimum confidence score (out of 10) to emit a signal
  min_confidence_score: 5

wallets:
  NIFTY_PULLBACK:
    cap: 100000
    logic: "PULLBACK"
    url: "https://archives.nseindia.com/content/indices/ind_nifty50list.csv"
    active_in: ["bull", "mixed"]  # Active in breadth regimes

  MIDCAP_BREAKOUT:
    cap: 100000
    logic: "BREAKOUT"
    url: "https://archives.nseindia.com/content/indices/ind_niftymidcap50list.csv"
    active_in: ["bull"]

  NIFTY_MEAN_REVERSION:
    cap: 100000
    logic: "MEAN_REVERSION"
    url: "https://archives.nseindia.com/content/indices/ind_nifty50list.csv"
    active_in: ["bull", "mixed"]

  NIFTY_52W_BREAKOUT:
    cap: 100000
    logic: "52W_HIGH"
    url: "https://archives.nseindia.com/content/indices/ind_nifty50list.csv"
    active_in: ["bull"]

email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 465
  weekly_summary_day: 6          # 0=Monday … 6=Sunday

network:
  request_timeout: 15            # HTTP timeout in seconds
  max_retries: 3
  retry_backoff_base: 2          # Exponential backoff base (seconds)
  ticker_fetch_delay: 0.2        # Seconds between yfinance calls
